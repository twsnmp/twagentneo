agent:
  id: "twagentneo-server-01"
  name: "Host-01"
  log_level: "info"

collectors:
  resource:
    enabled: true
    interval: 60s
  network:
    enabled: true
    interval: 180s
    arp_watch: true
    tcp_watch: true
  fim:
    enabled: true
    paths:
      # Linux defaults
      - /etc
      - /usr/bin
      - /usr/sbin
      # Windows defaults (ignored on non-Windows)
      # - C:\Windows\System32\drivers\etc
      # - C:\Windows\System32\wbem
      # - C:\Windows\System32\WindowsPowerShell\v1.0
    excludes:
      # Exclude temporary or backup file patterns (default: ["*.tmp", "*~"])
      - "*.tmp"
      - "*~"
  sca:
    enabled: true
    scan_on_startup: true        # Run baseline scan across target paths on agent startup
    scan_on_fim_events: true     # Immediately audit individual files on FIM create/write/chmod
    interval: 0s                 # Periodic scan interval (default: 0s disabled, event-driven)
    target_paths:
      # Target config directories to audit
      - /etc
    max_files: 2000
    max_file_size: 1048576       # 1MB
  logs:
    enabled: true
    paths:
      # Optional: custom log paths to tail (uses OS defaults if omitted or empty)
      # - /tmp/test.log
      # Linux defaults: /var/log/auth.log, /var/log/secure, /var/log/syslog
      # macOS defaults: /var/log/install.log, /var/log/system.log

# 2段階監査設定
audit:
  sigma:
    enabled: true              # 内蔵Sigmaルール自動実行
  ai_judge:
    enabled: true              # tensai パッケージによるローカルLLM判定
    model_path: ""             # 指定時はカスタムモデルパス、空の場合はtensaiデフォルト
    timeout: 5s                # 推論タイムアウト

exporters:
  mqtt:
    enabled: true
    broker: "tls://twsnmp-neo-server:8883"
    client_id: "twagentneo-01"
    topic_prefix: "twsnmpneo/agent"
    username: "twagentneo"
    password: "${MQTT_PASSWORD}"

  syslog:
    enabled: false
    endpoint: "udp://twsnmp-neo-server:514"
    format: "rfc5424"

  snmp_trap:
    enabled: true
    target: "twsnmp-neo-server:162"
    version: "v3"
    community: "public"
    v3:
      user: "twsnmpUser"
      auth_protocol: "SHA256"
      auth_password: "${TRAP_AUTH_PASS}"
      priv_protocol: "AES128"
      priv_password: "${TRAP_PRIV_PASS}"
